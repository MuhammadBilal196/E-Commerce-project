<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TechStore | Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html" class="logo">TechStore</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>
        <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
      </div>
    </nav>
  </header>

  <main class="fade-in" style="margin-top: 3rem;">
    <h1 class="section-title">Contact Support</h1>
    <div class="card" style="max-width: 600px; margin: 0 auto;">
      <form id="contact-form" onsubmit="event.preventDefault(); alert('Message sent successfully!'); this.reset();">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" required placeholder="Your Name">
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="name@example.com">
        </div>
        <div class="form-group">
          <label for="message">Your Message</label>
          <textarea id="message" required placeholder="How can we help you?"></textarea>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Send Message</button>
      </form>
    </div>
  </main>

  <footer><p>&copy; 2026 TechStore. All rights reserved.</p></footer>
  <script src="script.js"></script>
</body>
</html>
