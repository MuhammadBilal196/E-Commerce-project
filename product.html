<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TechStore | Product Details</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html" class="logo">TechStore</a>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
          <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
        </div>
      </nav>
    </header>

    <main class="fade-in" style="margin-top: 3rem">
      <div class="card" style="max-width: 700px; margin: 0 auto">
        <!-- JavaScript will inject the product details into these IDs -->
        <img
          id="product-img"
          src=""
          alt="Product Image"
          style="height: 350px"
        />
        <h1 id="product-title" style="margin-top: 1rem">Loading...</h1>
        <p id="product-price" class="price"></p>
        <p
          id="product-desc"
          style="margin-bottom: 2rem; line-height: 1.8; color: #475569"
        ></p>

        <button id="add-to-cart-btn" class="btn">Add to Cart</button>
        <a
          href="index.html"
          class="btn"
          style="background: #64748b; margin-left: 10px"
          >Back to Store</a
        >
      </div>
    </main>

    <footer><p>&copy; 2026 TechStore. All rights reserved.</p></footer>
    <script src="script.js"></script>
  </body>
</html>
